[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipe-assessment-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.28.1", "python-dotenv", "matplotlib"]

[project.scripts]
pipe-assessment-mcp = "pipe_assessment_mcp.server:main"

[tool.setuptools]
packages = ["pipe_assessment_mcp"]
package-dir = {pipe_assessment_mcp = "."}

[tool.setuptools.package-data]
pipe_assessment_mcp = ["rules/published/*.json"]
