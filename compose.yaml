services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    environment:
      API_UPSTREAM: http://backend:8000
    depends_on: [backend]
  backend:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      MCP_URL: http://mcp:8001/mcp
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes: [knowledge:/app/data/knowledge]
    depends_on: [mcp]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 4
  mcp:
    build: .
    command: ["python","-m","rag.mcp_server"]
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes: [knowledge:/app/data/knowledge]
volumes:
  knowledge: {}
